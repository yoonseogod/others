<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pocket Pond</title>
<style>
  :root{--bg:#11171a;--ink:#e9e2c8;--panel:rgba(16,22,24,.72);--edge:#3a4a3e}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none}
  canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;
    box-shadow:0 0 0 4px #0b0f10,0 0 0 8px #24302a,0 18px 50px rgba(0,0,0,.6)}
  #ui{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
    font:12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);z-index:2}
  button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--edge);padding:7px 10px;
    cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);image-rendering:pixelated}
  button:hover{border-color:#6b8a62}
  button:active{transform:translateY(1px)}
  #hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;
    color:var(--ink);background:var(--panel);border:2px solid var(--edge);padding:6px 10px;white-space:nowrap;
    transition:opacity 1.2s;pointer-events:none;z-index:2}
  @media (max-width:520px){#hint{font-size:10px;white-space:normal;text-align:center;width:80%}}
</style>
</head>
<body>
<canvas id="c" aria-label="An interactive pixel-art forest pond"></canvas>
<div id="hint">click or drag across the water · tap the trees · poke the frog</div>
<div id="ui">
  <button id="tod" title="Time of day (T)">☀ afternoon</button>
  <button id="snd" title="Sound (M)">♪ sound on</button>
</div>
<script>
'use strict';
/* ============================================================
   Pocket Pond — everything here is drawn from code, pixel by pixel.
   Internal resolution 256x160, scaled up with nearest-neighbour.
   ============================================================ */
const W = 256, H = 160, N = W * H;
const cvs = document.getElementById('c');
cvs.width = W; cvs.height = H;
const ctx = cvs.getContext('2d');
const img = ctx.createImageData(W, H);
const OUT = img.data;

/* ---------- tiny helpers ---------- */
let seed = 20240917;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const PERM = new Uint8Array(512);
{ const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
const hash = (x, y) => PERM[(PERM[x & 255] + y) & 255] / 255;
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o = 4) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += vnoise(x * f, y * f) * a; n += a; a *= .5; f *= 2; } return s / n; }
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - .47);
const bay = (x, y) => BAYER[(x & 3) + ((y & 3) << 2)];

/* ============================================================
   POND SHAPE + distance fields
   ============================================================ */
const CX = 128, CY = 102, RX = 113, RY = 38;
const isW = new Uint8Array(N);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const dx = (x - CX) / RX, dy = (y - CY) / RY, r = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
  let wob = 1 + (fbm(Math.cos(a) * 1.7 + 10, Math.sin(a) * 1.7 + 10, 3) - .5) * .34;
  if (dy < 0) wob = 1 + (wob - 1) * .3;          // calmer, straighter far shore
  if (r < wob) isW[y * W + x] = 1;
}
function edgePoint(a, inset) {
  const dx = Math.cos(a) * RX, dy = Math.sin(a) * RY, L = Math.hypot(dx, dy);
  let px = CX, py = CY;
  for (let s = 0; s < 1.6; s += .004) {
    const x = CX + dx * s, y = CY + dy * s;
    if (!isW[Math.round(y) * W + Math.round(x)]) return { x: px - dx / L * inset, y: py - dy / L * inset };
    px = x; py = y;
  }
  return { x: px, y: py };
}
/* rocks sitting in the shallows — they are solid for the waves too */
const rocks = [];
for (const [a, rx, ry, inset] of [[2.55, 6, 3, 2], [-2.95, 5, 3, 1], [0.42, 4, 2, 1], [1.62, 3, 2, 1], [-0.25, 3, 2, 0]]) {
  const p = edgePoint(a, inset); rocks.push({ x: Math.round(p.x), y: Math.round(p.y), rx, ry });
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++)
    if ((x / rx) ** 2 + (y / ry) ** 2 <= 1) isW[(Math.round(p.y) + y) * W + Math.round(p.x) + x] = 0;
}
function chamfer(inside) {
  const d = new Float32Array(N);
  for (let i = 0; i < N; i++) d[i] = inside(i) ? 1e4 : 0;
  const D = 2.236, V = 2;                     // vertical counts double (3/4 perspective)
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x; if (!d[i]) continue;
    d[i] = Math.min(d[i], d[i - 1] + 1, d[i - W] + V, d[i - W - 1] + D, d[i - W + 1] + D); }
  for (let y = H - 2; y > 0; y--) for (let x = W - 2; x > 0; x--) { const i = y * W + x; if (!d[i]) continue;
    d[i] = Math.min(d[i], d[i + 1] + 1, d[i + W] + V, d[i + W + 1] + D, d[i + W - 1] + D); }
  return d;
}
const dW = chamfer(i => isW[i]);       // water -> distance to shore
const dL = chamfer(i => !isW[i]);      // land  -> distance to water
let pondTop = H, pondBot = 0;
for (let i = 0; i < N; i++) if (isW[i]) { const y = (i / W) | 0; pondTop = Math.min(pondTop, y); pondBot = Math.max(pondBot, y); }
const AX = pondTop - .5;                // reflection axis (far shoreline)

/* per-water-pixel constants */
const WL = [];
for (let i = 0; i < N; i++) if (isW[i]) WL.push(i);
const NWL = WL.length;
const WIDX = Int32Array.from(WL), WX = new Int16Array(NWL), WY = new Int16Array(NWL);
const WD = new Float32Array(NWL), WDEP = new Float32Array(NWL), WSH = new Float32Array(NWL), WYN = new Float32Array(NWL), WBOT = new Float32Array(NWL);
for (let k = 0; k < NWL; k++) {
  const i = WIDX[k], x = i % W, y = (i / W) | 0; WX[k] = x; WY[k] = y; WD[k] = dW[i];
  WDEP[k] = clamp(smooth(.5, 20, dW[i]) * (.78 + .44 * fbm(x * .04, y * .09, 3)), 0, 1);
  WYN[k] = (y - pondTop) / (pondBot - pondTop);
  let sh = 1; if (y < CY) { if (!isW[i - W]) sh = .72; else if (!isW[i - 2 * W]) sh = .84; else if (!isW[i - 3 * W]) sh = .93; }
  WSH[k] = sh;
  WBOT[k] = fbm(x * .3, y * .6, 2) * (hash(x * 7, y * 3) > .93 ? .5 : 1);
}

/* ============================================================
   STATIC SCENERY LAYER (trees, banks, rocks, flowers)
   ============================================================ */
const SR = new Float32Array(N), SG = new Float32Array(N), SB = new Float32Array(N), SA = new Uint8Array(N);
for (let i = 0; i < N; i++) if (isW[i]) SA[i] = 2;
function sput(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x; if (SA[i] === 2) return; SR[i] = c[0]; SG[i] = c[1]; SB[i] = c[2]; SA[i] = 1; }

const bankY = new Int16Array(W);
for (let x = 0; x < W; x++) bankY[x] = Math.round(54 + fbm(x * .06, 9.3, 2) * 5);

// distant hazy ridge
for (let x = 0; x < W; x++) {
  const top = Math.round(30 + fbm(x * .016, 3.3, 3) * 20);
  for (let y = top; y < 62; y++) {
    const t = (y - top) / 20, n = fbm(x * .2, y * .2, 2);
    sput(x, y, mix([118, 150, 150], [92, 124, 126], clamp(t * .6 + (n - .5) * .5 + bay(x, y) * .2, 0, 1)));
  }
}
function pine(x0, base, h, w, P) {
  const top = base - h;
  for (let y = base - 3; y <= base + 1; y++) { sput(x0, y, P.trunk); sput(x0 + 1, y, P.trunkD); }
  for (let y = top; y <= base - 2; y++) {
    const t = (y - top) / (h - 2), ph = ((y - top) % 5) / 4;
    const hw = .5 + w * t * (.5 + .5 * ph);
    for (let x = Math.floor(x0 - hw); x <= Math.ceil(x0 + hw); x++) {
      const u = (x - x0) / (hw + .01); if (Math.abs(u) > 1.05) continue;
      let c = u < -.3 ? P.hi : u > .38 ? P.lo : P.mid;
      if (ph === 1 && u > -.5) c = P.lo;
      if (u > .05 && u < .38 && ((x + y) & 1)) c = P.lo;
      if (u < -.3 && u > -.55 && ((x + y) & 1)) c = P.mid;
      if (y === top) c = P.hi;
      sput(x, y, c);
    }
  }
}
function roundTree(x0, base, h, P) {
  const cy = base - h * .62, R0 = h * .42, circ = [];
  for (let k = 0; k < 7; k++) circ.push({ x: x0 + rr(-R0, R0) * .55, y: cy + rr(-R0, R0) * .45, r: R0 * rr(.45, .7) });
  circ.push({ x: x0, y: cy, r: R0 * .7 });
  for (let y = Math.round(cy); y <= base + 1; y++) { sput(x0, y, P.trunk); sput(x0 + 1, y, P.trunkD); }
  const x1 = Math.floor(x0 - R0 * 1.3), x2 = Math.ceil(x0 + R0 * 1.3), y1 = Math.floor(cy - R0 * 1.2), y2 = Math.ceil(cy + R0 * 1.1);
  for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) {
    let best = -1, nx = 0, ny = 0;
    for (const c of circ) { const dx = (x - c.x) / c.r, dy = (y - c.y) / c.r, v = 1 - Math.hypot(dx, dy); if (v > best) { best = v; nx = dx; ny = dy; } }
    if (best < 0) continue;
    const l = -nx * .62 - ny * .78 + (fbm(x * .4, y * .4, 2) - .5) * .7 + bay(x, y) * .35;
    sput(x, y, l > .42 ? P.hi : l > 0 ? P.mid : l > -.45 ? P.lo : P.dk);
  }
}
const HAZE = { hi: [96, 132, 116], mid: [76, 112, 104], lo: [60, 92, 92], trunk: [70, 80, 80], trunkD: [60, 70, 72] };
const PINE = { hi: [88, 138, 84], mid: [54, 100, 68], lo: [34, 70, 54], trunk: [80, 56, 42], trunkD: [56, 40, 34] };
const ROUND = { hi: [146, 178, 84], mid: [98, 146, 66], lo: [62, 106, 56], dk: [40, 76, 48], trunk: [86, 60, 44], trunkD: [60, 42, 34] };
const AUT = { hi: [222, 168, 84], mid: [192, 122, 58], lo: [140, 82, 48], dk: [96, 58, 42], trunk: [86, 60, 44], trunkD: [60, 42, 34] };
for (let x = -4; x < W + 4; x += rr(4, 8)) pine(Math.round(x), ri(51, 55), ri(13, 22), rr(3.5, 5.5), HAZE);
for (let x = -6; x < W + 6; x += rr(9, 16)) {
  const xi = Math.round(x), r = rnd();
  if (r < .5) pine(xi, ri(56, 59), ri(24, 40), rr(6, 9), PINE);
  else roundTree(xi, ri(57, 60), ri(20, 32), r < .66 ? AUT : ROUND);
}
// banks
const GRASS = [[50, 92, 52], [72, 122, 58], [100, 150, 64], [142, 184, 82]];
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x; if (isW[i] || y < bankY[x]) continue;
  const n = fbm(x * .09, y * .18, 3), far = y < CY, dl = dL[i];
  let c;
  if (far && y < pondTop + 30 && (isW[i + W] || isW[i + 2 * W])) c = isW[i + W] ? [56, 42, 34] : [86, 64, 46];
  else if (dl < 1.5) c = [74, 60, 44];
  else if (dl < 3.4 + n * 1.6) c = (n + bay(x, y) * .3) > .5 ? [178, 156, 106] : [152, 130, 88];
  else {
    const v = n + (y / H) * .22 - (far ? .1 : 0) + bay(x, y) * .16;
    c = GRASS[v < .42 ? 0 : v < .54 ? 1 : v < .67 ? 2 : 3];
    if (far) c = mix(c, [86, 120, 104], .25);
  }
  sput(x, y, c);
}
// grass tufts, flowers, mushrooms
for (let k = 0; k < 520; k++) {
  const x = ri(0, W - 1), y = ri(bankY[x] + 2, H - 1), i = y * W + x;
  if (isW[i] || dL[i] < 4.5) continue;
  sput(x, y, GRASS[3]); sput(x, y - 1, GRASS[2]); if (rnd() < .5) sput(x + 1, y, GRASS[0]); if (rnd() < .4) sput(x - 1, y - 1, GRASS[2]);
}
const FLOWERS = [[244, 240, 228], [250, 212, 92], [232, 128, 160], [176, 156, 236]];
for (let k = 0; k < 70; k++) {
  const x = ri(0, W - 1), y = ri(bankY[x] + 3, H - 1), i = y * W + x;
  if (isW[i] || dL[i] < 5) continue;
  const c = FLOWERS[ri(0, 3)];
  sput(x, y, GRASS[0]); sput(x, y - 1, c); if (y > 120) { sput(x - 1, y - 1, mix(c, [255, 255, 255], .2)); sput(x, y - 2, mix(c, [0, 0, 0], .15)); }
}
for (const [mx, my] of [[44, 151], [52, 154], [214, 150]]) {
  if (isW[my * W + mx]) continue;
  sput(mx, my, [232, 220, 196]); sput(mx, my - 1, [226, 214, 190]);
  for (let x = -2; x <= 2; x++) sput(mx + x, my - 2, x === -2 ? [150, 40, 36] : [206, 64, 50]);
  for (let x = -1; x <= 1; x++) sput(mx + x, my - 3, [222, 84, 64]);
  sput(mx - 1, my - 2, [250, 240, 230]); sput(mx + 1, my - 3, [250, 240, 230]);
}
// rocks
for (const r of rocks) {
  for (let y = -r.ry; y <= r.ry; y++) for (let x = -r.rx; x <= r.rx; x++) {
    const dx = x / r.rx, dy = y / r.ry; if (dx * dx + dy * dy > 1) continue;
    const l = -dx * .6 - dy * .8 + bay(r.x + x, r.y + y) * .4;
    let c = l > .55 ? [178, 176, 160] : l > 0 ? [134, 134, 124] : l > -.6 ? [100, 102, 98] : [70, 74, 74];
    if (dy < -.35 && hash(x + 40, y + 40) > .45) c = [104, 138, 70];
    sput(r.x + x, r.y + y, c);
  }
}
// framing trees in the foreground corners
const FRONT = { hi: [98, 142, 70], mid: [62, 104, 56], lo: [40, 74, 48], dk: [24, 48, 38] };
function canopy(list, P) {
  for (let y = 0; y < 70; y++) for (let x = 0; x < W; x++) {
    let best = -1, nx = 0, ny = 0;
    for (const c of list) { const dx = (x - c.x) / c.r, dy = (y - c.y) / (c.r * .85), v = 1 - Math.hypot(dx, dy); if (v > best) { best = v; nx = dx; ny = dy; } }
    if (best < 0) continue;
    const edgeBite = best < .12 && fbm(x * .5, y * .5, 2) < .45; if (edgeBite) continue;
    const l = -nx * .55 - ny * .8 + (fbm(x * .35, y * .35, 3) - .5) * .9 + bay(x, y) * .3;
    sput(x, y, l > .5 ? P.hi : l > .05 ? P.mid : l > -.4 ? P.lo : P.dk);
  }
}
function trunk(x0, x1, y0, y1) {
  for (let y = y0; y <= y1; y++) {
    const flare = Math.max(0, y - (y1 - 8)) * .6;
    for (let x = Math.floor(x0 - flare); x <= Math.ceil(x1 + flare); x++) {
      const u = (x - x0 + flare) / (x1 - x0 + 2 * flare + .01);
      let c = u < .25 ? [122, 90, 62] : u < .7 ? [88, 64, 46] : [58, 42, 34];
      if (hash(x * 3, y >> 1) > .82) c = [62, 46, 36];
      sput(x, y, c);
    }
  }
}
trunk(-2, 5, 20, 118); trunk(250, 258, 18, 112);
canopy([{ x: 6, y: 4, r: 26 }, { x: 32, y: -4, r: 18 }, { x: -6, y: 30, r: 16 }, { x: 44, y: 10, r: 11 }, { x: 18, y: 26, r: 12 }], FRONT);
canopy([{ x: 252, y: 4, r: 24 }, { x: 228, y: -4, r: 16 }, { x: 262, y: 32, r: 15 }, { x: 214, y: 6, r: 9 }], FRONT);
// isolate which pixels are "foliage" (clickable for leaves)
const FOLIAGE = new Uint8Array(N);
for (let y = 0; y < 70; y++) for (let x = 0; x < W; x++) if (SA[y * W + x] === 1 && y < bankY[x]) FOLIAGE[y * W + x] = 1;

/* ============================================================
   TIME OF DAY
   ============================================================ */
const PRESETS = [
  { name: '☀ afternoon', top: [96, 166, 214], bot: [236, 228, 190], tint: [1, 1, 1], sun: [255, 248, 214], sunR: 6, sx: 196, sy: 15, glow: .45,
    cHi: [255, 252, 242], cLo: [196, 212, 226], stars: 0, fire: 0, fly: 1, moon: 0, deep: [18, 50, 66] },
  { name: '☁ dusk', top: [62, 64, 124], bot: [252, 164, 112], tint: [1, .8, .74], sun: [255, 196, 122], sunR: 9, sx: 74, sy: 42, glow: .9,
    cHi: [255, 200, 162], cLo: [146, 104, 138], stars: .25, fire: .55, fly: .25, moon: 0, deep: [26, 34, 60] },
  { name: '☾ night', top: [10, 16, 40], bot: [36, 54, 94], tint: [.34, .42, .66], sun: [238, 236, 212], sunR: 5, sx: 186, sy: 19, glow: .35,
    cHi: [92, 104, 146], cLo: [40, 50, 82], stars: 1, fire: 1, fly: 0, moon: 1, deep: [8, 18, 36] },
];
let envIdx = 0;
const env = JSON.parse(JSON.stringify(PRESETS[0]));
function stepEnv(k) {
  const T = PRESETS[envIdx];
  for (const key in T) {
    if (Array.isArray(T[key])) for (let j = 0; j < 3; j++) env[key][j] += (T[key][j] - env[key][j]) * k;
    else if (typeof T[key] === 'number') env[key] += (T[key] - env[key]) * k;
  }
}

/* ============================================================
   WATER SIMULATION — heightfield, 2 sim rows per screen row
   (so circular ripples squash into perspective ellipses)
   ============================================================ */
const SW = W, SH = H * 2, SN = SW * SH, DAMP = .988;
let hc = new Float32Array(SN), hp = new Float32Array(SN);
const smask = new Uint8Array(SN);
for (let sy = 0; sy < SH; sy++) for (let x = 0; x < SW; x++) smask[sy * SW + x] = isW[(sy >> 1) * W + x];
const ACTL = []; for (let i = 0; i < SN; i++) if (smask[i]) ACTL.push(i);
const ACT = Int32Array.from(ACTL), NB = new Int32Array(ACT.length * 4);
for (let k = 0; k < ACT.length; k++) { const i = ACT[k]; [i - 1, i + 1, i - SW, i + SW].forEach((n, j) => NB[k * 4 + j] = smask[n] ? n : i); }
function simStep() {
  const c = hc, p = hp;
  for (let k = 0, n = ACT.length; k < n; k++) {
    const i = ACT[k], o = k << 2;
    p[i] = ((c[NB[o]] + c[NB[o + 1]] + c[NB[o + 2]] + c[NB[o + 3]]) * .5 - p[i]) * DAMP;
  }
  hc = p; hp = c;
}
function disturb(x, y, r, amp) {
  const sx = x, sy = y * 2, R2 = 4 * r * r;
  for (let yy = Math.floor(sy - 2 * r); yy <= Math.ceil(sy + 2 * r); yy++) for (let xx = Math.floor(sx - 2 * r); xx <= Math.ceil(sx + 2 * r); xx++) {
    if (xx < 0 || yy < 0 || xx >= SW || yy >= SH) continue;
    const d2 = (xx - sx) ** 2 + (yy - sy) ** 2; if (d2 > R2) continue;
    const i = yy * SW + xx; if (smask[i]) hc[i] += amp * Math.exp(-d2 / (r * r));
  }
}
const hs = new Float32Array(N);           // screen-res height (refreshed each frame)
const water = (x, y) => { x = Math.round(x); y = Math.round(y); return x >= 0 && y >= 0 && x < W && y < H && isW[y * W + x] === 1; };
const distAt = (x, y) => { x = clamp(Math.round(x), 0, W - 1); y = clamp(Math.round(y), 0, H - 1); return dW[y * W + x]; };
function gradAt(x, y) {
  x = Math.round(x); y = Math.round(y); if (x < 2 || y < 2 || x > W - 3 || y > H - 3) return [0, 0, 0];

      if (a === 2) continue;

}

  const wc = [220, 236, 244];
  if (flap) { put(x, y - 1, wc, .8 * a); put(x + 1, y - 1, wc, .8 * a); put(x, y + 1, wc, .5 * a); }
  else { put(x - 1, y - 1, wc, .7 * a); put(x + 1, y - 2, wc, .7 * a); put(x + 1, y + 1, wc, .4 * a); }
}
function glow(x, y, b) {
  const c = [255, 232, 120];
  addLight(x, y, c, b); addLight(x + 1, y, c, b * .4); addLight(x - 1, y, c, b * .4); addLight(x, y + 1, c, b * .4); addLight(x, y - 1, c, b * .4);
  addLight(x + 1, y + 1, c, b * .15); addLight(x - 1, y - 1, c, b * .15); addLight(x + 1, y - 1, c, b * .15); addLight(x - 1, y + 1, c, b * .15);
}

function render() {
  const t = time;
  TR = env.tint[0]; TG = env.tint[1]; TB = env.tint[2];
  composeBG(t);
  R.set(BR); G.set(BG); B.set(BB);
  UA.fill(0);
  for (const f of fish) stampFish(f);
  renderWater(t);

  // floating things
  for (const L of leaves) if (L.state === 'float') drawLeaf(L);
  for (const p of pads) drawPad(p);
  if (frog.state === 'sit') drawFrog();
  for (const L of leaves) if (L.state === 'ground') drawLeaf(L);
  // reeds (reflections first, then stems, back to front)
  const RP = reeds.map(reedPoints);
  reeds.forEach((r, k) => drawReedReflection(r, RP[k], t));
  reeds.forEach((r, k) => drawReed(r, RP[k]));
  for (const b of bits) put(b.x, b.y - b.z, b.c);
  for (const d of drops) { put(d.x, d.y - d.z, [226, 240, 246], .9); if (d.big) put(d.x, d.y - d.z - 1, [196, 222, 232], .6); }
  for (const f of flies) drawFly(f);
  for (const L of leaves) if (L.state === 'fall') drawLeaf(L);
  if (frog.state === 'jump') drawFrog();

  // emissive: fireflies + their reflections
  if (env.fire > .03) for (const f of fireflies) {
    const b = Math.pow(Math.max(0, Math.sin(t * f.s + f.p)), 3) * env.fire;
    if (b < .02) continue;
    glow(Math.round(f.x), Math.round(f.y - f.z), b);
    const wy = f.y + f.z * .85; if (water(f.x, wy)) glow(Math.round(f.x + Math.sin(wy + t * 2) * .6), Math.round(wy), b * .45);
  }

  // posterize w/ ordered dither + vignette -> 8-bit
  for (let i = 0, o = 0; i < N; i++, o += 4) {
    const v = VIG[i], dd = DITH[i] * STEP;
    OUT[o] = Math.round((R[i] * v + dd) / STEP) * STEP;
    OUT[o + 1] = Math.round((G[i] * v + dd) / STEP) * STEP;
    OUT[o + 2] = Math.round((B[i] * v + dd) / STEP) * STEP;
    OUT[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

/* ============================================================
   LOOP + layout
   ============================================================ */
function layout() {
  const vw = innerWidth, vh = innerHeight - 70;
  let s = Math.min(vw / W, vh / H);
  if (s >= 2) s = Math.floor(s); s = Math.max(.5, s);
  const w = W * s, h = H * s;
  Object.assign(cvs.style, { width: w + 'px', height: h + 'px', left: (vw - w) / 2 + 'px', top: Math.max(8, (innerHeight - h) / 2 - 22) + 'px' });
}
addEventListener('resize', layout); layout();
// let the pond settle a little before first paint
for (let k = 0; k < 30; k++) update();
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000); last = now;
  let n = 0; while (acc >= 1 / 60 && n < 4) { update(); acc -= 1 / 60; n++; }
  if (n === 4) acc = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// expose for debugging
window.__pond = { press, update, cycleTod, render, env };
</script>
